name: OwnerSeal
version: '1.0.0'
main: ua.fentez.ownerseal.OwnerSeal
api-version: '1.21'
author: Fentez
website: https://fentez.pp.ua
description: Protect maps and smithing templates from unauthorized duplication using a craftable Owner's Seal.

commands:
  ownerseal:
    description: "Administration commands for the OwnerSeal plugin."
    usage: "/ownerseal <reload|unseal>"
    permission: "ownerseal.admin"

permissions:
  ownerseal.admin:
    description: "Allows reloading the plugin and forcefully removing seals from items."
    default: op
